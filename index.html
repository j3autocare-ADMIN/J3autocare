<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JETHRI AUTO CARE - Premium Automotive Customization</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* The iframe will handle scrolling */
            background-color: #030304; /* Matches the dark background of both designs */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }
        /* Show Desktop by default on large screens */
        @media (min-width: 768px) {
            #desktop-frame { display: block; }
        }
        /* Show Mobile by default on small screens */
        @media (max-width: 767px) {
            #mobile-frame { display: block; }
        }
    </style>
</head>
<body>

    <!-- Desktop Design Iframe (Shown on screens 768px and wider) -->
    <iframe id="desktop-frame" src="stitch_j3_orginal_ui_ux/home_jethri_auto_care_fluid_scroll_flow_soft_lighting/code.html" title="Desktop View"></iframe>
    
    <!-- Mobile Design Iframe (Shown on screens narrower than 768px) -->
    <iframe id="mobile-frame" src="stitch_j3_orginal_ui_ux/home_jethri_auto_care_mobile/code.html" title="Mobile View"></iframe>

    <script>
        // Additional JavaScript logic to guarantee the correct frame is displayed dynamically on window resize
        function applyResponsiveView() {
            var desktopFrame = document.getElementById('desktop-frame');
            var mobileFrame = document.getElementById('mobile-frame');
            
            if (window.innerWidth >= 768) {
                desktopFrame.style.display = 'block';
                mobileFrame.style.display = 'none';
            } else {
                desktopFrame.style.display = 'none';
                mobileFrame.style.display = 'block';
            }
        }

        // Run on initial load
        applyResponsiveView();

        // Run whenever the window size changes
        window.addEventListener('resize', applyResponsiveView);
    </script>
</body>
</html>
